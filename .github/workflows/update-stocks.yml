name: Update Stock Data

on:
  schedule:
    - cron: "30,41,52 9 * * *"
    - cron: "3,14,25,36,47,58 10 * * *"
    - cron: "9,20,31,42,53 11 * * *"
    - cron: "4,15,26,37,48,59 12 * * *"
    - cron: "10,21,32,43,54 13 * * *"
    - cron: "5,16,27,38,49 14 * * *"
    - cron: "11,22,33,44,55 15 * * *"
    - cron: "6 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update stock data
        run: npm run update-stocks

      - name: Commit updated stocks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stocks.json update-times.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stock data"
            git push
          fi